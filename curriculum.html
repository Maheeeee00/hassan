<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Curriculum Manager</title>
    <style>
      :root {
        --bg: #f3f4f6;
        --card: #ffffff;
        --text: #111827;
        --muted: #6b7280;
        --primary: #2563eb;
        --danger: #dc2626;
        --border: #d1d5db;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        color: var(--text);
        background: var(--bg);
      }

      .page {
        max-width: 980px;
        margin: 24px auto;
        padding: 0 16px 24px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
      }

      .menu-wrap {
        position: relative;
      }

      button {
        border: 0;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 14px;
        cursor: pointer;
      }

      .btn-primary {
        background: var(--primary);
        color: #fff;
      }

      .btn-secondary {
        background: #e5e7eb;
        color: #111827;
      }

      .menu {
        position: absolute;
        right: 0;
        top: calc(100% + 8px);
        width: 210px;
        padding: 8px;
        border-radius: 10px;
        background: #fff;
        border: 1px solid var(--border);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        display: none;
        z-index: 20;
      }

      .menu.open {
        display: block;
      }

      .menu button {
        width: 100%;
        text-align: left;
        background: transparent;
      }

      .menu button:hover {
        background: #f3f4f6;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        min-height: 230px;
      }

      .card h2 {
        margin: 0 0 12px;
        font-size: 20px;
      }

      .value {
        white-space: pre-wrap;
        line-height: 1.5;
      }

      .placeholder {
        color: var(--muted);
        font-style: italic;
      }

      .status {
        margin-top: 12px;
        min-height: 20px;
        font-size: 14px;
      }

      .status.error {
        color: var(--danger);
      }

      .status.success {
        color: #15803d;
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(17, 24, 39, 0.45);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 40;
      }

      .modal-backdrop.open {
        display: flex;
      }

      .modal {
        width: min(560px, 92vw);
        background: #fff;
        border-radius: 12px;
        border: 1px solid var(--border);
        padding: 16px;
      }

      .modal h3 {
        margin: 0 0 12px;
      }

      .field {
        margin-bottom: 12px;
      }

      .field label {
        display: block;
        font-size: 13px;
        color: #374151;
        margin-bottom: 6px;
      }

      .field textarea,
      .field input {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px;
        font: inherit;
      }

      .field textarea {
        min-height: 120px;
        resize: vertical;
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 14px;
      }

      @media (max-width: 820px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="topbar">
        <h1>Curriculum</h1>
        <div class="menu-wrap">
          <button id="addButton" class="btn-primary" type="button">Add</button>
          <div id="addMenu" class="menu">
            <button id="addSallybusAction" type="button">Add / Update Sallybus</button>
            <button id="updateCalendarAction" type="button">Update Calander</button>
          </div>
        </div>
      </div>

      <div class="grid">
        <section class="card">
          <h2>Calander</h2>
          <div id="calendarValue" class="value placeholder">No calander added yet.</div>
        </section>

        <section class="card">
          <h2>Sallybus</h2>
          <div id="sallybusValue" class="value placeholder">No sallybus added yet.</div>
        </section>
      </div>

      <div id="status" class="status"></div>
    </div>

    <div id="modalBackdrop" class="modal-backdrop">
      <div class="modal">
        <h3 id="modalTitle"></h3>
        <form id="modalForm">
          <div class="field">
            <label for="contentInput" id="contentLabel"></label>
            <textarea id="contentInput" required></textarea>
          </div>

          <div class="field" id="passwordField" style="display: none;">
            <label for="passwordInput">Password</label>
            <input id="passwordInput" type="password" minlength="4" />
          </div>

          <div class="actions">
            <button class="btn-secondary" type="button" id="cancelButton">Cancel</button>
            <button class="btn-primary" type="submit" id="saveButton">Save</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      var currentAction = null;

      function byId(id) {
        return document.getElementById(id);
      }

      function setStatus(message, isError) {
        var status = byId("status");
        status.textContent = message || "";
        status.className = "status " + (message ? (isError ? "error" : "success") : "");
      }

      function setValue(containerId, value, emptyText) {
        var el = byId(containerId);
        if (value) {
          el.textContent = value;
          el.className = "value";
        } else {
          el.textContent = emptyText;
          el.className = "value placeholder";
        }
      }

      function toggleMenu(forceOpen) {
        var menu = byId("addMenu");
        var shouldOpen = typeof forceOpen === "boolean" ? forceOpen : !menu.classList.contains("open");
        if (shouldOpen) {
          menu.classList.add("open");
        } else {
          menu.classList.remove("open");
        }
      }

      function openModal(action) {
        currentAction = action;
        byId("modalBackdrop").classList.add("open");
        byId("contentInput").value = "";
        byId("passwordInput").value = "";

        if (action === "sallybus") {
          byId("modalTitle").textContent = "Add / Update Sallybus";
          byId("contentLabel").textContent = "Sallybus";
          byId("passwordField").style.display = "block";
          byId("passwordInput").required = true;
        } else {
          byId("modalTitle").textContent = "Update Calander";
          byId("contentLabel").textContent = "Calander";
          byId("passwordField").style.display = "none";
          byId("passwordInput").required = false;
        }
      }

      function closeModal() {
        currentAction = null;
        byId("modalBackdrop").classList.remove("open");
      }

      function loadData() {
        setStatus("Loading...", false);
        google.script.run
          .withSuccessHandler(function (res) {
            setValue("calendarValue", res.calander, "No calander added yet.");
            setValue("sallybusValue", res.sallybus, "No sallybus added yet.");
            setStatus("", false);
          })
          .withFailureHandler(function (err) {
            setStatus(err.message || "Failed to load data.", true);
          })
          .getCurriculumData();
      }

      function handleSubmit(event) {
        event.preventDefault();
        var content = byId("contentInput").value.trim();
        var password = byId("passwordInput").value.trim();

        if (!content) {
          setStatus("Please enter text before saving.", true);
          return;
        }

        if (currentAction === "sallybus" && !password) {
          setStatus("Password is required for sallybus.", true);
          return;
        }

        byId("saveButton").disabled = true;
        setStatus("Saving...", false);

        if (currentAction === "sallybus") {
          google.script.run
            .withSuccessHandler(function (res) {
              byId("saveButton").disabled = false;
              closeModal();
              setStatus(res.message || "Sallybus saved.", false);
              loadData();
            })
            .withFailureHandler(function (err) {
              byId("saveButton").disabled = false;
              setStatus(err.message || "Unable to save sallybus.", true);
            })
            .saveOrUpdateSallybus({
              sallybus: content,
              password: password
            });
        } else if (currentAction === "calander") {
          google.script.run
            .withSuccessHandler(function (res) {
              byId("saveButton").disabled = false;
              closeModal();
              setStatus(res.message || "Calander updated.", false);
              loadData();
            })
            .withFailureHandler(function (err) {
              byId("saveButton").disabled = false;
              setStatus(err.message || "Unable to update calander.", true);
            })
            .updateCalander({
              calander: content
            });
        } else {
          byId("saveButton").disabled = false;
          setStatus("Unknown action.", true);
        }
      }

      function bindEvents() {
        byId("addButton").addEventListener("click", function () {
          toggleMenu();
        });

        byId("addSallybusAction").addEventListener("click", function () {
          toggleMenu(false);
          openModal("sallybus");
        });

        byId("updateCalendarAction").addEventListener("click", function () {
          toggleMenu(false);
          openModal("calander");
        });

        byId("cancelButton").addEventListener("click", closeModal);
        byId("modalForm").addEventListener("submit", handleSubmit);

        document.addEventListener("click", function (event) {
          var menuWrap = document.querySelector(".menu-wrap");
          if (!menuWrap.contains(event.target)) {
            toggleMenu(false);
          }
        });
      }

      bindEvents();
      loadData();
    </script>
  </body>
</html>
